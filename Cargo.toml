[package]
name = "manim"
version = "0.1.0"
edition = "2021"
description = "A Rust rewrite of the Manim mathematical animation engine: parallel CPU and GPU rendering"
license = "MIT"
readme = "README.md"
repository = "https://github.com/ItsTatsuya/manim-rust"
keywords = ["manim", "animation", "math", "video", "visualization"]
categories = ["multimedia::video", "graphics", "visualization"]
rust-version = "1.97"
publish = false

[features]
default = ["gpu", "vello", "text", "svg", "math", "script"]
# wgpu-based renderer (Vulkan / DX12 / Metal). Auto-selected when a hardware GPU is found.
gpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck", "dep:lyon"]
# Second CPU rasterizer (vello_cpu). `--renderer cpu` times it against tiny-skia per
# complexity bucket and keeps the faster: ~3x faster than tiny-skia on heavy scenes.
vello = ["dep:vello_cpu"]
# Text mobjects built from system font outlines.
text = ["dep:fontdb", "dep:ttf-parser", "dep:rustybuzz"]
# SVGMobject (usvg).
svg = ["dep:usvg"]
# Equations typeset by an embedded Typst compiler (no TeX install needed).
# TypeScript/JavaScript scene scripts on an embedded QuickJS engine.
script = ["text", "dep:rquickjs", "dep:oxc"]
math = ["svg", "text", "dep:typst", "dep:typst-svg", "dep:typst-layout", "dep:typst-assets"]

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
glam = "0.29"
rayon = "1.10"
# PNG I/O comes from `png` directly; skipping tiny-skia's own png-format keeps a single png in the tree.
tiny-skia = { version = "0.11", default-features = false, features = ["std", "simd"] }
png = "0.18"
gif = "0.14"
# Backends match `Backends::PRIMARY` (DX12/Vulkan on Windows, Vulkan on Linux, Metal on macOS);
# no GLES/WebGPU. wgpu 29 matches gpui-ce, so a host linking both ships one wgpu/naga.
wgpu = { version = "29", optional = true, default-features = false, features = ["std", "parking_lot", "wgsl", "dx12", "vulkan", "metal"] }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }
lyon = { version = "1", optional = true }
fontdb = { version = "0.24", optional = true }
ttf-parser = { version = "0.25", optional = true }
rustybuzz = { version = "0.20", optional = true }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
usvg = { version = "0.50", optional = true }
typst = { version = "0.15", optional = true }
typst-svg = { version = "0.15", optional = true }
typst-layout = { version = "0.15", optional = true }
rquickjs = { version = "0.14", optional = true, features = ["loader", "macro"] }
oxc = { version = "0.158", optional = true, features = ["transformer", "codegen", "semantic"] }
typst-assets = { version = "0.15", optional = true, features = ["fonts"] }
yuvutils-rs = { version = "0.8.3", features = ["rayon"] }
vello_cpu = { version = "0.4", default-features = false, features = ["std", "u8_pipeline"], optional = true }

[[example]]
name = "features"
required-features = ["text", "math"]

[[example]]
name = "showcase"
required-features = ["text"]

[[example]]
name = "trajectory"
required-features = ["text"]

[[example]]
name = "tables"
required-features = ["text", "math"]

[[example]]
name = "anim_gallery"
required-features = ["script", "math"]

[[test]]
name = "animations"
required-features = ["text"]

[[test]]
name = "morphing"
required-features = ["text"]

[[test]]
name = "mobjects"
required-features = ["text"]

[[test]]
name = "rendering"
required-features = ["text", "vello"]

[[test]]
name = "studio"
required-features = ["text"]

[lints.rust]
missing_docs = "warn"
unsafe_op_in_unsafe_fn = "warn"
unused_must_use = "warn"

[lints.clippy]
dbg_macro = "warn"
todo = "warn"
unimplemented = "warn"

# Keep dependencies (rasterizers, encoders) fast even in debug builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 4

# Shipping builds (`cargo build --profile dist`): ~20% smaller and a little faster, slower to build.
[profile.dist]
inherits = "release"
lto = "thin"
codegen-units = 1

